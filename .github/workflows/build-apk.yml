name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --list 2>/dev/null | grep "platforms;android-3" | tail -10 || true
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" 2>&1 || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - run: npm ci

      - run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --info 2>&1 | tail -100

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notivo-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
