name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: List available SDK packages
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          $SDKMANAGER --list 2>/dev/null | grep -E "platforms;android-3[0-9]|build-tools;3[0-9]" | head -20
          echo "--- Installing ---"
          yes | $SDKMANAGER --licenses 2>/dev/null
          yes | $SDKMANAGER "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - run: npm ci
      - run: npx cap sync android

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
